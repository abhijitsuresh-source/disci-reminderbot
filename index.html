<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#0e0e0e" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Disci" />
  <title>Disci</title>
  <link rel="manifest" href="/manifest.json" />
  <link rel="icon" href="/favicon.ico" />
  <link rel="apple-touch-icon" href="/icon-192.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #0e0e0e;
      --chat-bg: #0e0e0e;
      --bubble-bot: #1f1f1f;
      --bubble-user: #005c4b;
      --header: #1a1a1a;
      --input-bg: #1a1a1a;
      --border: #2a2a2a;
      --accent: #00a884;
      --text: #e9edef;
      --text2: #8696a0;
      --text3: #3b4a54;
      --p10: #ff4747; --p9: #ff4747;
      --p8: #ff6b35; --p7: #ff6b35;
      --p6: #ffb347; --p5: #ffb347;
      --p4: #e8ff47; --p3: #e8ff47;
      --p2: #47ffb2; --p1: #47b2ff;
      --radius-bubble: 8px;
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { height: 100%; background: var(--bg); color: var(--text); font-family: 'Inter', system-ui, sans-serif; overflow: hidden; }

    #app { height: 100%; display: flex; flex-direction: column; max-width: 480px; margin: 0 auto; position: relative; }

    /* ── ONBOARDING ── */
    #screen-onboard {
      display: flex; flex-direction: column; justify-content: center; align-items: center;
      height: 100%; padding: 32px 28px; gap: 0; background: var(--bg);
      position: absolute; inset: 0; z-index: 50;
    }
    #screen-onboard.hidden { display: none; }
    .ob-logo { font-size: 11px; font-weight: 600; letter-spacing: 4px; color: var(--accent); margin-bottom: 20px; }
    .ob-title { font-size: 32px; font-weight: 600; text-align: center; line-height: 1.2; margin-bottom: 10px; }
    .ob-title span { color: var(--accent); }
    .ob-sub { font-size: 13px; color: var(--text2); text-align: center; line-height: 1.6; margin-bottom: 40px; }
    .ob-field { width: 100%; margin-bottom: 12px; }
    .ob-label { font-size: 11px; font-weight: 600; letter-spacing: 1px; color: var(--text2); margin-bottom: 6px; display: block; }
    .ob-input {
      width: 100%; background: var(--input-bg); border: 1px solid var(--border);
      border-radius: 8px; padding: 14px 16px; color: var(--text);
      font-family: 'Inter', sans-serif; font-size: 15px; outline: none;
    }
    .ob-input:focus { border-color: var(--accent); }
    .ob-input::placeholder { color: var(--text3); }
    .ob-btn {
      width: 100%; background: var(--accent); color: #fff; border: none;
      border-radius: 8px; padding: 15px; font-family: 'Inter', sans-serif;
      font-size: 15px; font-weight: 600; cursor: pointer; margin-top: 8px;
    }
    .ob-btn:active { opacity: 0.85; }

    /* ── HEADER ── */
    .chat-header {
      background: var(--header); padding: 10px 16px;
      display: flex; align-items: center; gap: 12px;
      border-bottom: 1px solid var(--border); flex-shrink: 0;
      padding-top: max(10px, env(safe-area-inset-top));
    }
    .avatar {
      width: 40px; height: 40px; border-radius: 50%;
      background: var(--accent); display: flex; align-items: center;
      justify-content: center; font-size: 18px; flex-shrink: 0;
    }
    .header-info { flex: 1; }
    .header-name { font-size: 15px; font-weight: 600; }
    .header-status { font-size: 12px; color: var(--accent); }

    /* ── CHAT AREA ── */
    .chat-area {
      flex: 1; overflow-y: auto; padding: 12px 12px 8px;
      display: flex; flex-direction: column; gap: 4px;
      scroll-behavior: smooth;
    }
    .chat-area::-webkit-scrollbar { display: none; }

    /* date divider */
    .date-divider {
      text-align: center; font-size: 11px; color: var(--text2);
      background: var(--border); border-radius: 6px;
      padding: 4px 10px; align-self: center; margin: 8px 0;
    }

    /* bubbles */
    .bubble-row { display: flex; margin-bottom: 2px; }
    .bubble-row.bot { justify-content: flex-start; }
    .bubble-row.user { justify-content: flex-end; }

    .bubble {
      max-width: 80%; padding: 8px 12px 6px;
      border-radius: var(--radius-bubble);
      font-size: 14px; line-height: 1.5; position: relative;
      word-break: break-word;
    }
    .bubble-row.bot .bubble {
      background: var(--bubble-bot);
      border-top-left-radius: 2px;
    }
    .bubble-row.user .bubble {
      background: var(--bubble-user);
      border-top-right-radius: 2px;
      color: #e9edef;
    }
    .bubble-time {
      font-size: 10px; color: var(--text2); margin-top: 3px;
      text-align: right; display: flex; align-items: center;
      justify-content: flex-end; gap: 3px;
    }
    .bubble-row.user .bubble-time { color: rgba(255,255,255,0.5); }

    /* typing indicator */
    .typing-bubble { background: var(--bubble-bot); border-radius: var(--radius-bubble); border-top-left-radius: 2px; padding: 12px 16px; display: inline-flex; gap: 4px; align-items: center; }
    .typing-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--text2); animation: bounce 1.2s infinite; }
    .typing-dot:nth-child(2) { animation-delay: 0.2s; }
    .typing-dot:nth-child(3) { animation-delay: 0.4s; }
    @keyframes bounce { 0%,60%,100% { transform: translateY(0); } 30% { transform: translateY(-5px); } }

    /* priority chip inside bubble */
    .p-chip {
      display: inline-block; font-size: 11px; font-weight: 600;
      padding: 2px 8px; border-radius: 4px; margin: 0 2px;
      color: #000;
    }

    /* quick reply buttons */
    .quick-replies {
      display: flex; flex-wrap: wrap; gap: 6px;
      padding: 6px 12px 8px; flex-shrink: 0;
    }
    .qr-btn {
      background: transparent; border: 1px solid var(--accent);
      color: var(--accent); border-radius: 16px;
      padding: 6px 14px; font-size: 13px; font-family: 'Inter', sans-serif;
      cursor: pointer; transition: all 0.15s; white-space: nowrap;
    }
    .qr-btn:active { background: var(--accent); color: #fff; }

    /* ── INPUT BAR ── */
    .input-bar {
      background: var(--header); padding: 8px 12px;
      padding-bottom: max(8px, var(--safe-bottom));
      display: flex; align-items: flex-end; gap: 8px; flex-shrink: 0;
    }
    .input-wrap {
      flex: 1; background: var(--input-bg); border-radius: 20px;
      display: flex; align-items: flex-end; padding: 8px 14px; gap: 8px;
      border: 1px solid var(--border);
    }
    #msg-input {
      flex: 1; background: transparent; border: none; outline: none;
      color: var(--text); font-family: 'Inter', sans-serif; font-size: 15px;
      resize: none; max-height: 100px; line-height: 1.4;
    }
    #msg-input::placeholder { color: var(--text3); }

    .attach-btn, .send-btn, .mic-btn {
      width: 40px; height: 40px; border-radius: 50%; border: none;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; font-size: 18px; flex-shrink: 0; transition: all 0.15s;
    }
    .attach-btn { background: transparent; color: var(--text2); }
    .attach-btn:active { color: var(--accent); }
    .mic-btn { background: var(--accent); color: #fff; }
    .mic-btn.recording { background: #ff4747; animation: pulse-rec 1s infinite; }
    .send-btn { background: var(--accent); color: #fff; display: none; }
    .send-btn.visible { display: flex; }
    @keyframes pulse-rec { 0%,100% { box-shadow: 0 0 0 0 rgba(255,71,71,0.4); } 50% { box-shadow: 0 0 0 10px rgba(255,71,71,0); } }

    /* hidden file input */
    #file-input { display: none; }

    /* image in bubble */
    .bubble img { max-width: 200px; border-radius: 6px; display: block; margin-bottom: 4px; }

    /* reminder card inside bubble */
    .reminder-card-bubble {
      background: rgba(255,255,255,0.05); border-radius: 6px;
      padding: 10px 12px; margin-top: 4px; border-left: 3px solid var(--accent);
    }
    .rcb-title { font-size: 14px; font-weight: 600; margin-bottom: 4px; }
    .rcb-meta { font-size: 12px; color: var(--text2); display: flex; flex-direction: column; gap: 2px; }

    /* loading spinner in bubble */
    .mini-spinner {
      width: 16px; height: 16px; border: 2px solid var(--border);
      border-top-color: var(--accent); border-radius: 50%;
      animation: spin 0.7s linear infinite; display: inline-block;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* toast */
    .toast {
      position: fixed; bottom: 80px; left: 50%; transform: translateX(-50%) translateY(10px);
      background: #2a2a2a; border-radius: 8px; padding: 10px 18px;
      font-size: 13px; color: var(--text); opacity: 0; transition: all 0.25s;
      pointer-events: none; z-index: 100; white-space: nowrap;
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  </style>
</head>
<body>
<div id="app">

  <!-- ONBOARDING -->
  <div id="screen-onboard">
    <img src="/icon-192.png" style="width:72px;height:72px;border-radius:16px;margin-bottom:20px;" />
    <h1 class="ob-title">Your reminder<br/><span>that won't shut up.</span></h1>
    <p class="ob-sub">Talk to it like WhatsApp.<br/>It'll make sure you follow through.</p>

    <!-- Step 1: Name + Email, then passkey -->
    <div id="ob-step-1">
      <div class="ob-field">
        <label class="ob-label">Your name</label>
        <input class="ob-input" id="ob-name" type="text" placeholder="What do we call you?" autocomplete="name" />
      </div>
      <div class="ob-field">
        <label class="ob-label">Email</label>
        <input class="ob-input" id="ob-email" type="email" placeholder="your@email.com" autocomplete="email" />
      </div>
      <button class="ob-btn" id="ob-btn" onclick="handleOnboard()">Continue →</button>
    </div>

    <!-- Step 2: Passkey prompt -->
    <div id="ob-step-2" style="display:none; text-align:center; width:100%;">
      <div style="font-size:56px; margin-bottom:16px;" id="ob-icon">🔐</div>
      <h2 style="font-size:20px; font-weight:600; margin-bottom:10px;" id="ob-step2-title">Set up your passkey</h2>
      <p style="font-size:13px; color:var(--text2); line-height:1.7; margin-bottom:28px;" id="ob-step2-sub">Use Face ID or fingerprint to sign in — no password, no email link.</p>
      <button class="ob-btn" id="ob-passkey-btn" onclick="handlePasskeyRegister()">🔐 Set up passkey</button>
      <button class="ob-btn" id="ob-passkey-login-btn" style="display:none; margin-top:10px; background:transparent; border:1px solid var(--accent); color:var(--accent);" onclick="handlePasskeyLogin()">Sign in with passkey</button>
      <p style="font-size:11px; color:var(--text3); margin-top:16px;">Your biometric data never leaves your device.</p>
    </div>
  </div>

  <!-- CHAT HEADER -->
  <div class="chat-header">
    <div class="avatar"><img src="/icon-192.png" style="width:100%;height:100%;border-radius:50%;object-fit:cover;" /></div>
    <div class="header-info">
      <div class="header-name">Disci</div>
      <div class="header-status" id="header-status">online</div>
    </div>
  </div>

  <!-- CHAT MESSAGES -->
  <div class="chat-area" id="chat-area"></div>

  <!-- QUICK REPLIES -->
  <div class="quick-replies" id="quick-replies"></div>

  <!-- INPUT BAR -->
  <div class="input-bar">
    <button class="attach-btn" id="attach-btn" title="Send photo">📎</button>
    <input type="file" id="file-input" accept="image/*" capture="environment" />
    <div class="input-wrap">
      <textarea id="msg-input" placeholder="Message" rows="1"></textarea>
    </div>
    <button class="mic-btn" id="mic-btn" title="Voice message">🎤</button>
    <button class="send-btn" id="send-btn" title="Send">➤</button>
  </div>

</div>

<div class="toast" id="toast"></div>
<script src="/app.js"></script>
</body>
</html>
